apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-deployment
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-deployment
  strategy: {}
  template:
    metadata:
      labels:
        app: backend-deployment
    spec:
      containers:
      - image: ghcr.io/john4web/coffee-backend
        name: coffee-backend
        ports:
          - containerPort: 3001
        env:
          - name: MONGODB_URI
            valueFrom:
                configMapKeyRef:
                    name: my-configmap
                    key: MONGODB_URI
        resources: {}
