apiVersion: v1
kind: Pod
metadata:
  labels:
    run: my-backend
  name: my-backend
spec:
  containers:
  - image: ghcr.io/john4web/coffee-backend
    name: my-backend
    env:
      - name: MONGODB_URI
        value: mongodb://localhost:27017/coffeedb
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
